#################################### Paths ###############################
[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

#################################### Server ###############################
[server]
protocol = http
http_port = 3000
domain = localhost
enforce_domain = false
root_url = %(protocol)s://%(domain)s/
serve_from_sub_path = false

#################################### Database #############################
[database]
type = sqlite3
path = grafana.db

#################################### Security #############################
[security]
admin_user = admin
disable_gravatar = true
cookie_secure = false
cookie_samesite = lax
allow_embedding = false
# Disable signup link on login page
disable_initial_admin_creation = false

#################################### Users ###############################
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark
editors_can_admin = false
viewers_can_edit = false

#################################### Anonymous auth ######################
[auth.anonymous]
enabled = false

#################################### Logging #############################
[log]
mode = console
level = info
filters = rendering:debug

#################################### Alerting ###########################
[alerting]
enabled = true
execute_alerts = true

#################################### Unified Alerting ####################
[unified_alerting]
enabled = true

#################################### Explore ###########################
[explore]
enabled = true

#################################### Metrics ##########################
[metrics]
enabled = true
interval_seconds = 10

#################################### Dashboards #######################
[dashboards]
versions_to_keep = 20
default_home_dashboard_path = /var/lib/grafana/dashboards/system-overview.json

#################################### Analytics #######################
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

#################################### Feature Toggles #################
[feature_toggles]
enable =
