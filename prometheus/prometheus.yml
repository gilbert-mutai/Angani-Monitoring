global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project: angani-monitor

# Load alerting rules from the alerts directory
rule_files:
  - /etc/prometheus/alerts/*.yml

# Alertmanager configuration (configure if you add Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:

  # ── Prometheus itself ───────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # ── Node Exporter (host metrics) ────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: docker-host
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ── cAdvisor (container metrics) ────────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          host: docker-host
    metric_relabel_configs:
      # Drop high-cardinality metrics we don't need
      - source_labels: [__name__]
        regex: "container_tasks_state|container_memory_failures_total"
        action: drop

  # ── Grafana metrics ──────────────────────────────────────────────
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics
    basic_auth:
      username: admin
      # Reference a file to avoid plaintext credentials in this config:
      # password_file: /etc/prometheus/grafana_password

  # ── Loki metrics (enabled when Loki is running) ──────────────────
  # - job_name: loki
  #   static_configs:
  #     - targets: ["loki:3100"]
  #   metrics_path: /metrics
