groups:

  - name: host.rules
    interval: 1m
    rules:

      - alert: HostHighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ printf \"%.1f\" $value }}% (threshold: 90%)"

      - alert: HostCriticalCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ printf \"%.1f\" $value }}%"

      - alert: HostHighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ printf \"%.1f\" $value }}%"

      - alert: HostDiskUsageHigh
        expr: |
          100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"} /
                  node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage high on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "Disk usage is {{ printf \"%.1f\" $value }}%"

      - alert: HostDiskUsageCritical
        expr: |
          100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"} /
                  node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}) * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk nearly full on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "Disk usage is {{ printf \"%.1f\" $value }}%"

      - alert: HostHighLoadAverage
        expr: |
          node_load5 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High load average on {{ $labels.instance }}"
          description: "Load average (5m) relative to CPU cores is {{ printf \"%.2f\" $value }}"

      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host exporter unreachable: {{ $labels.instance }}"
          description: "Node Exporter on {{ $labels.instance }} has been down for more than 1 minute."

  - name: container.rules
    interval: 1m
    rules:

      - alert: ContainerHighCPU
        expr: |
          sum by(name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU"
          description: "Container CPU usage: {{ printf \"%.1f\" $value }}%"

      - alert: ContainerHighMemory
        expr: |
          (container_memory_usage_bytes{name!="",image!=""} /
           container_spec_memory_limit_bytes{name!="",image!=""} > 0) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory"
          description: "Container memory usage is {{ printf \"%.1f\" $value }}% of its limit"

      - alert: ContainerRestarting
        expr: |
          rate(container_last_seen{name!="",image!=""}[5m]) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} may be restarting"
          description: "Container {{ $labels.name }} has not been seen in the last 5 minutes."
